name: Release

# Bump `version` in Cargo.toml, commit, then push the matching tag to publish a release:
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fails in seconds, before any build, if the tag, Cargo.toml and Cargo.lock disagree.
  version:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match Cargo.toml and Cargo.lock
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version. Bump the version in Cargo.toml, commit, and tag that commit as v$version."
            exit 1
          fi
          locked=$(grep -A1 '^name = "piviz"$' Cargo.lock | grep -m1 '^version' | cut -d'"' -f2)
          if [ "$locked" != "$version" ]; then
            echo "::error::Cargo.lock still has version $locked. Run cargo build to update it, commit Cargo.lock, and move the tag to that commit."
            exit 1
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: piviz.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: piviz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev libclang-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: bash
        run: |
          name="piviz-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/release/${{ matrix.exe }}" README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          rm -r "$name"

      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = "$env:GITHUB_REF_NAME".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" installer\piviz.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: piviz-${{ matrix.target }}
          path: dist/*

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
